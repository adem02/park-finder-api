name: Deploy

# Production directement (pas de staging pour l'instant) : un merge dans main déploie.
# Les PR vers main passent déjà la CI obligatoire (ruleset), inutile de la rejouer ici.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un déploiement à la fois, jamais annulé en cours de route (migrations).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets et variables dans Settings → Environments → production (voir docs/architecture.md).
    environment: production
    env:
      IMAGE: ${{ vars.SCW_REGISTRY_IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      # 1. Image d'abord : si le build échoue, la base n'a pas bougé.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ vars.SCW_REGISTRY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Migrations sur Supabase, via le Session pooler (port 5432).
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Run migrations
        run: yarn migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATIONS_URL }}
          DATABASE_SSL: verify
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}

      # 3. Le Serverless Container passe sur la nouvelle image. Ses variables
      #    d'environnement (base, JWT, CORS, Google…) se règlent dans la console Scaleway.
      - name: Point the container to the new image
        uses: scaleway/action-scw@v0
        with:
          version: v2.24.0
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          args: container container update ${{ vars.SCW_CONTAINER_ID }} registry-image=${{ env.IMAGE }} region=fr-par

      - name: Redeploy the container
        uses: scaleway/action-scw@v0
        with:
          version: v2.24.0
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          args: container container redeploy ${{ vars.SCW_CONTAINER_ID }} region=fr-par --wait

      # 4. Le déploiement n'est réussi que si l'API répond et joint la base.
      - name: Smoke test
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "${{ vars.API_URL }}/health"
