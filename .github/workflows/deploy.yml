name: Deploy

# Production directement (pas de staging pour l'instant) : un merge dans main déploie.
# Les PR vers main passent déjà la CI obligatoire (ruleset), inutile de la rejouer ici.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un déploiement à la fois, jamais annulé en cours de route (migrations).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets et variables dans Settings → Environments → production (voir docs/architecture.md).
    environment: production
    env:
      IMAGE: ${{ vars.SCW_REGISTRY_IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      # 1. Image d'abord : si le build échoue, la base n'a pas bougé.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ vars.SCW_REGISTRY_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Migrations sur Supabase, via le Session pooler (port 5432).
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Run migrations
        run: yarn migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATIONS_URL }}
          DATABASE_SSL: verify
          DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}

      # 3. Le Serverless Container passe sur la nouvelle image. Ses variables
      #    d'environnement (base, JWT, CORS, Google…) se règlent dans la console Scaleway.
      - name: Point the container to the new image
        uses: scaleway/action-scw@v0
        with:
          version: v2.24.0
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          args: container container update ${{ vars.SCW_CONTAINER_ID }} registry-image=${{ env.IMAGE }} region=fr-par

      # Changer l'image relance le déploiement (statut « pending »). On attend que le
      # conteneur soit « ready » sur la nouvelle image, sinon le test passerait sur l'ancienne.
      # La CLI installée par l'étape précédente est dans le PATH ; elle lit les clés dans l'env.
      - name: Wait for the new version to be ready
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
          CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
        run: |
          for attempt in $(seq 1 36); do
            container=$(scw container container get "$CONTAINER_ID" -o json)
            status=$(echo "$container" | jq -r '.status')
            image=$(echo "$container" | jq -r '.registry_image')
            echo "Attempt $attempt: status=$status"
            if [ "$status" = "error" ]; then
              echo "$container" | jq -r '.error_message'
              exit 1
            fi
            if [ "$status" = "ready" ] && [ "$image" = "$IMAGE" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "The container did not become ready on $IMAGE within 6 minutes."
          exit 1

      # 4. Le déploiement n'est réussi que si l'API répond et joint la base.
      - name: Smoke test
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "${{ vars.API_URL }}/health"
