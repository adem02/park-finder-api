name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    # Sur un push, inutile de tout relancer pour de la doc. Pas de filtre sur les PR :
    # un check obligatoire qui ne démarre jamais bloquerait le merge.
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Un nouveau push sur une PR annule le run précédent, devenu inutile.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Format
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts" "seed/**/*.ts"

      # Sans --fix : la CI signale, elle ne modifie rien.
      - name: Lint
        run: npx eslint "{src,apps,libs,test,seed}/**/*.ts"

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: yarn test:unit

      - name: Build
        run: yarn build

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Même image que docker-compose.yml. Base jetable propre au job, identifiants factices.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: parkfinder
          POSTGRES_PASSWORD: parkfinder
          POSTGRES_DB: parkfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkfinder -d parkfinder_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Lu par le globalSetup Jest : pas de testcontainers en CI.
      INTEGRATION_DATABASE_URL: postgresql://parkfinder:parkfinder@localhost:5432/parkfinder_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Integration tests
        run: yarn test:integration

  image:
    # L'image de prod exécute un bundle (scripts/bundle.mjs) : on la construit et on la démarre
    # pour de vrai, pour qu'un bundle cassé ne puisse pas partir en production.
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Build production image
        run: docker build --target production -t park-finder-api:ci .

      - name: Start the image
        # Valeurs factices : pas de base (/health répond 503), aucun appel externe au démarrage.
        run: |
          cat > ci.env <<'EOF'
          NODE_ENV=production
          DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/ci
          DATABASE_SSL=off
          JWT_SECRET=00000000-0000-4000-8000-000000000000
          JWT_EXPIRES_IN=15m
          GOOGLE_CLIENT_ID=ci
          GOOGLE_CLIENT_SECRET=ci
          GOOGLE_CALLBACK_URL=http://localhost:3000/auth/google/callback
          APPLE_CLIENT_ID=ci
          APPLE_TEAM_ID=ci
          APPLE_KEY_ID=ci
          APPLE_PRIVATE_KEY=ci
          APPLE_CALLBACK_URL=http://localhost:3000/auth/apple/callback
          CLOUDINARY_CLOUD_NAME=ci
          CLOUDINARY_API_KEY=ci
          CLOUDINARY_API_SECRET=ci
          EOF
          docker run -d --name api -p 3000:3000 --cpus=0.5 --memory=512m --env-file ci.env park-finder-api:ci

      - name: Smoke test
        run: sh scripts/smoke-test.sh http://localhost:3000

      - name: Startup log
        # Contient « ready N ms after start » : temps de démarrage à 0,5 vCPU, comme en prod.
        if: always()
        run: docker logs api
