name: Keep alive

# Supabase Free met en pause un projet après 7 jours de faible activité.
# Un appel quotidien à /health (qui interroge la base) compte comme activité.
# Note : GitHub suspend les workflows planifiés d'un repo sans activité depuis 60 jours.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: ping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Call /health
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 20 --retry-all-errors \
            "${{ vars.API_URL }}/health"
